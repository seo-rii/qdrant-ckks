syntax = "proto3";

package qdrant;
option csharp_namespace = "Qdrant.Client.Grpc";

import "telemetry_internal.proto";
import "private_hnsw_oram_service.proto";
import "private_result_oram_service.proto";

service QdrantInternal {
  // Get current commit and term on the target peer.
  rpc GetConsensusCommit(GetConsensusCommitRequest)
      returns (GetConsensusCommitResponse) {}

  // Wait until the target peer reached the given commit ID.
  rpc WaitOnConsensusCommit(WaitOnConsensusCommitRequest)
      returns (WaitOnConsensusCommitResponse) {}

  // Get telemetry
  rpc GetTelemetry(GetTelemetryRequest) returns (GetTelemetryResponse) {}

  // Get audit log entries from this peer
  rpc GetAuditLog(GetAuditLogRequest) returns (GetAuditLogResponse) {}

  // Durably stage one owner-signed encrypted private ORAM writeback.
  rpc PreparePrivateOramWriteback(PreparePrivateOramWritebackRequest)
      returns (PreparePrivateOramWritebackResponse) {}

  // Apply a prepared writeback after its epoch transition commits through Raft.
  rpc FinalizePrivateOramWriteback(CompletePrivateOramWritebackRequest)
      returns (CompletePrivateOramWritebackResponse) {}

  // Remove an uncommitted prepared writeback while its old view is still intact.
  rpc AbortPrivateOramWriteback(CompletePrivateOramWritebackRequest)
      returns (CompletePrivateOramWritebackResponse) {}

  // Idempotently install one complete signed encrypted index on a replica.
  rpc InstallPrivateOramIndex(InstallPrivateOramIndexRequest)
      returns (InstallPrivateOramIndexResponse) {}

  // Idempotently install one consensus-bound live encrypted index for movement.
  rpc InstallPrivateOramLiveReplica(InstallPrivateOramLiveReplicaRequest)
      returns (InstallPrivateOramLiveReplicaResponse) {}

  // Ask the active source peer to preinstall and submit automatic shard recovery.
  rpc RequestPrivateOramShardRecovery(RequestPrivateOramShardRecoveryRequest)
      returns (RequestPrivateOramShardRecoveryResponse) {}
}

message GetConsensusCommitRequest {}

message GetConsensusCommitResponse {
  // Raft commit as u64
  int64 commit = 1;
  // Raft term as u64
  int64 term = 2;
}

message WaitOnConsensusCommitRequest {
  // Raft commit as u64
  int64 commit = 1;
  // Raft term as u64
  int64 term = 2;
  // Timeout in seconds
  int64 timeout = 3;
}

message WaitOnConsensusCommitResponse {
  // False if commit/term is diverged and never reached or if timed out.
  bool ok = 1;
}

message GetAuditLogRequest {
  // ISO-8601 start time (inclusive), omit for no lower bound
  optional string time_from = 1;
  // ISO-8601 end time (exclusive), omit for no upper bound
  optional string time_to = 2;
  // Key=value filters applied to every JSON field
  map<string, string> filters = 3;
  // Maximum number of entries to return
  uint64 limit = 4;
}

message GetAuditLogResponse {
  // Audit log entries as raw JSON strings (one per entry)
  repeated string entries = 1;
}

// Internal-only wire contract for replicated private ORAM writebacks. The RPC
// methods using these messages are registered only after receiver-side runtime,
// signature, fixed-budget, and exact-transition validation is connected.
enum PrivateOramReplicationIndexKind {
  PRIVATE_ORAM_REPLICATION_INDEX_KIND_UNSPECIFIED = 0;
  PRIVATE_ORAM_REPLICATION_INDEX_KIND_HNSW = 1;
  PRIVATE_ORAM_REPLICATION_INDEX_KIND_RESULT = 2;
}

message PrivateOramReplicationEpochState {
  uint64 index_epoch = 1;
  string root_hash = 2;
}

message PrivateOramReplicationTransition {
  PrivateOramReplicationEpochState old = 1;
  PrivateOramReplicationEpochState new = 2;
  string writeback_digest = 3;
}

message PrivateOramReplicationBucket {
  uint32 version = 1;
  uint64 bucket_id = 2;
  uint64 index_epoch = 3;
  string ciphertext = 4;
  string ciphertext_sha256 = 5;
  string bucket_commitment = 6;
}

message PrivateOramReplicationSignature {
  string alg = 1;
  string key_id = 2;
  string sig = 3;
}

message PreparePrivateOramWritebackRequest {
  string collection_name = 1;
  string collection_id = 2;
  PrivateOramReplicationIndexKind index_kind = 3;
  // Required for HNSW and empty for the collection-level result ORAM index.
  string vector_name = 4;
  uint32 version = 5;
  PrivateOramReplicationTransition transition = 6;
  uint64 bucket_count = 7;
  repeated PrivateOramReplicationBucket updated_buckets = 8;
  PrivateOramReplicationSignature commit_signature = 9;
}

message PreparePrivateOramWritebackResponse {
  // Echoed only after the receiver independently derives the same digest.
  string writeback_digest = 1;
}

message CompletePrivateOramWritebackRequest {
  string collection_name = 1;
  string collection_id = 2;
  PrivateOramReplicationIndexKind index_kind = 3;
  string vector_name = 4;
  PrivateOramReplicationTransition transition = 5;
  string signing_key_id = 6;
}

message CompletePrivateOramWritebackResponse {
  bool completed = 1;
}

message PrivateHnswInitialReplicationBundle {
  PrivateHnswManifest manifest = 1;
  PrivateHnswSignature manifest_signature = 2;
  repeated PrivateHnswBucket buckets = 3;
}

message PrivateResultOramInitialReplicationBundle {
  PrivateResultOramManifest manifest = 1;
  PrivateResultOramSignature manifest_signature = 2;
  repeated PrivateResultOramBucket buckets = 3;
}

message InstallPrivateOramIndexRequest {
  string collection_name = 1;
  string collection_id = 2;
  PrivateOramReplicationIndexKind index_kind = 3;
  string vector_name = 4;
  oneof bundle {
    PrivateHnswInitialReplicationBundle hnsw = 5;
    PrivateResultOramInitialReplicationBundle result = 6;
  }
}

message InstallPrivateOramIndexResponse {
  uint64 index_epoch = 1;
  string root_hash = 2;
}

message PrivateHnswLiveReplicationBundle {
  PrivateHnswManifest manifest = 1;
  PrivateHnswSignature manifest_signature = 2;
  PrivateOramReplicationEpochState current = 3;
  optional string writeback_digest = 4;
  repeated PrivateHnswBucket buckets = 5;
}

message PrivateResultOramLiveReplicationBundle {
  PrivateResultOramManifest manifest = 1;
  PrivateResultOramSignature manifest_signature = 2;
  PrivateOramReplicationEpochState current = 3;
  optional string writeback_digest = 4;
  repeated PrivateResultOramBucket buckets = 5;
}

message InstallPrivateOramLiveReplicaRequest {
  string collection_name = 1;
  string collection_id = 2;
  PrivateOramReplicationIndexKind index_kind = 3;
  string vector_name = 4;
  oneof bundle {
    PrivateHnswLiveReplicationBundle hnsw = 5;
    PrivateResultOramLiveReplicationBundle result = 6;
  }
  // Hash of the consensus lease reserved by a shard-transfer coordinator.
  string transfer_lease_id_hash = 7;
}

message InstallPrivateOramLiveReplicaResponse {
  uint64 index_epoch = 1;
  string root_hash = 2;
  optional string writeback_digest = 3;
}

message RequestPrivateOramShardRecoveryRequest {
  string collection_name = 1;
  uint32 shard_id = 2;
  uint64 source_peer_id = 3;
  uint64 target_peer_id = 4;
}

message RequestPrivateOramShardRecoveryResponse {
  bool accepted = 1;
}
