name: qdrant-sec CI

on:
  push:
    branches: [sec]
  pull_request:
    branches: [sec]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  qdrant-sec-tests:
    name: qdrant-sec encryption boundary tests
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: qdrant-sec-ci

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libunwind-dev protobuf-compiler

      - name: Run qdrant-sec crypto crate security tests
        run: cargo test --locked -p qdrant-sec

      - name: Run collection qdrant-sec config tests
        run: cargo test --locked -p collection ckks --lib

      - name: Run crypto migration state-machine tests
        run: cargo test --locked -p collection crypto_migration --lib

      - name: Run crypto migration integration tests
        run: cargo test --locked -p collection crypto_migration_ --test integration

      - name: Run qdrant-sec runtime tests
        run: cargo test --locked -p qdrant ckks

      - name: Run collection crypto runtime validation tests
        run: |
          cargo test --locked -p qdrant validate_collection_crypto_runtime_
          cargo test --locked -p qdrant validate_recovered_collection_crypto_
          cargo test --locked -p qdrant validate_backend_
          cargo test --locked -p qdrant openfhe_backend_factory_

      - name: Run segment-native CKKS ciphertext index tests
        run: cargo test --locked -p segment ckks_ciphertext

      - name: Run CKKS sidecar HNSW graph persistence tests
        run: cargo test --locked -p qdrant ckks_sidecar_hnsw_

      - name: Run encrypted vector runtime boundary tests
        run: |
          cargo test --locked -p qdrant vector_write_plan_
          cargo test --locked -p qdrant encrypted_vector_from_payload
          cargo test --locked -p qdrant delete_payload_rejects_encrypted_vector_sidecar_paths

      - name: Run encrypted payload read and migration tests
        run: |
          cargo test --locked -p qdrant server_side_encrypted_payload_read_mode_decrypts_get_and_scroll
          cargo test --locked -p qdrant metadata_value_encrypted_read_mode_decrypts_with_payload_decrypt_access
          cargo test --locked -p qdrant payload_decrypt_collection_access
          cargo test --locked -p qdrant point_read_params_support_encrypted_payload_query_mode
          cargo test --locked -p qdrant payload_export_
          cargo test --locked -p qdrant payload_write_plan_
          cargo test --locked -p qdrant payload_write_plan_decrypts_server_envelopes_for_crypto_migration
          cargo test --locked -p qdrant payload_crypto_migration_run
          cargo test --locked -p qdrant client_nonce_replay_error_tells_clients_to_regenerate_envelope
          cargo test --locked -p qdrant runtime_generate_response_
          cargo test --locked -p qdrant runtime_resource_key_
          cargo test --locked -p qdrant runtime_rewrap_response_returns_applyable_material_patch_without_mutating_settings
          cargo test --locked -p qdrant runtime_rewrap_response_rejects_malformed_material_identifiers
          cargo test --locked -p qdrant runtime_retire_response_
          cargo test --locked -p qdrant collection_crypto_manifest_
          cargo test --locked -p qdrant snapshot_export_encrypted_payload_mode_is_raw_only

      - name: Run runtime material source hardening tests
        run: |
          cargo test --locked -p qdrant validate_crypto_settings_
          cargo test --locked -p qdrant validate_material_
          cargo test --locked -p qdrant decode_direct_material_key_

      - name: Run runtime crypto parity tests
        run: |
          cargo test --locked -p qdrant crypto_runtime_capability
          cargo test --locked -p qdrant crypto_runtime_health_

      - name: Run encrypted cluster data movement parity tests
        run: cargo test --locked -p qdrant encrypted_cluster_

      - name: Run crypto telemetry redaction and parity observability tests
        run: |
          cargo test --locked -p collection log_value_redacts_
          cargo test --locked -p qdrant app_telemetry_does_not_serialize_crypto_key_material
          cargo test --locked -p qdrant crypto_runtime_fingerprint
          cargo test --locked -p qdrant test_build_report_payload_

      - name: Run encrypted inspector redaction tests
        run: |
          cargo test --locked -p qdrant --features service_debug --bin wal_inspector collection_wal_display_redacts
          cargo test --locked -p qdrant --features service_debug --bin segment_inspector payload_redaction_hides_server_client_and_vector_markers

      - name: Run encrypted data movement tests
        run: |
          cargo test --locked -p storage encrypted_
          cargo test --locked -p storage audit_error_redaction

      - name: Run encrypted leakage integration tests
        run: |
          cargo test --locked -p qdrant do_upsert_points_encrypts_payload_before_storage
          cargo test --locked -p collection encrypted_payload --test integration
          cargo test --locked -p collection encrypted_payload_marker_upsert_does_not_leak_plaintext_to_collection_files --test integration
          cargo test --locked -p collection encrypted_vector --test integration
          cargo test --locked -p collection encrypted_vector_rejects_plaintext_vector_writes --test integration
          cargo test --locked -p collection encrypted_vector_rejects_plaintext_vector_reads --test integration

      - name: Run encrypted shard recovery tests
        run: |
          cargo test --locked -p qdrant shard_snapshot_recovery_
          cargo test --locked -p storage encrypted_snapshot_recovery_

      - name: Run CLI snapshot crypto preflight tests
        run: cargo test --locked -p qdrant cli_snapshot_crypto_preflight_rejects

      - name: Run storage create-collection compatibility test
        run: cargo test --locked -p storage alias

      - name: Validate default settings parsing
        run: cargo test --locked -p qdrant settings::tests::test_default_config
